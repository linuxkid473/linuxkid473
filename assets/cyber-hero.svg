<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="vihaan — breaking and making things">
  <style>
    .title { font: 900 120px 'Arial Black', Impact, 'Helvetica Neue', sans-serif; letter-spacing: 10px; }
    .mono  { font: 700 20px 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .tag   { font: 700 13px 'SF Mono', Menlo, Consolas, 'Courier New', monospace; letter-spacing: 5px; }
    .glitch-a { animation: ga 4s infinite steps(1); }
    .glitch-b { animation: gb 4s infinite steps(1); }
    .scan { animation: scan 6s linear infinite; }
    .cursor { animation: blink 1s infinite steps(1); }
    @keyframes ga { 0%,90%,100% { transform: translate(-4px,0); } 92% { transform: translate(-10px,2px); } 94% { transform: translate(6px,-2px); } 96% { transform: translate(-3px,0); } }
    @keyframes gb { 0%,90%,100% { transform: translate(4px,0); }  92% { transform: translate(10px,-2px); } 94% { transform: translate(-6px,2px); } 96% { transform: translate(3px,0); } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset="0.62" stop-color="#1a0630"/>
      <stop offset="1" stop-color="#3a0a4a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcee0a"/>
      <stop offset="0.5" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#7a1cff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="sunclip"><rect x="0" y="0" width="1000" height="206"/></clipPath>
    <clipPath id="frame"><rect width="1000" height="300" rx="6"/></clipPath>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#sky)"/>

    <!-- retro sun -->
    <g clip-path="url(#sunclip)">
      <circle cx="500" cy="190" r="118" fill="url(#sun)" opacity="0.9"/>
      <g fill="#1a0630">
        <rect x="370" y="168" width="260" height="4"/>
        <rect x="370" y="180" width="260" height="6"/>
        <rect x="370" y="194" width="260" height="8"/>
      </g>
    </g>

    <!-- skyline -->
    <g fill="#0b0418" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1">
      <path d="M0 206 V150 h34 v-22 h28 v40 h22 v-58 h20 v58 h40 v-30 h26 v30 h30 v-46 h18 v46 h46 v-18 h30 v18 H300 V206 Z"/>
      <path d="M700 206 V160 h28 v-34 h16 v-24 h6 v24 h16 v34 h34 v-44 h24 v44 h30 v-28 h22 v28 h40 v-52 h18 v52 h26 v-22 h40 V206 Z"/>
    </g>
    <!-- lit windows -->
    <g fill="#fcee0a" opacity="0.85">
      <rect x="44" y="140" width="4" height="4"/><rect x="52" y="152" width="4" height="4"/>
      <rect x="96" y="124" width="4" height="4"/><rect x="132" y="150" width="4" height="4"/>
      <rect x="196" y="140" width="4" height="4"/><rect x="236" y="164" width="4" height="4"/>
      <rect x="738" y="136" width="4" height="4"/><rect x="800" y="130" width="4" height="4"/>
      <rect x="858" y="158" width="4" height="4"/><rect x="934" y="150" width="4" height="4"/>
    </g>
    <g fill="#ff2bd6" opacity="0.9">
      <rect x="66" y="176" width="4" height="4"/><rect x="164" y="170" width="4" height="4"/>
      <rect x="760" y="168" width="4" height="4"/><rect x="832" y="176" width="4" height="4"/><rect x="902" y="170" width="4" height="4"/>
    </g>

    <!-- perspective grid floor -->
    <rect y="206" width="1000" height="94" fill="#0a0414"/>
    <g stroke="#ff2bd6" stroke-width="1.2" opacity="0.75">
      <path d="M0 206H1000"/><path d="M0 218H1000" opacity="0.8"/><path d="M0 234H1000" opacity="0.7"/>
      <path d="M0 256H1000" opacity="0.6"/><path d="M0 286H1000" opacity="0.5"/>
      <path d="M500 206V300"/>
      <path d="M440 206L250 300"/><path d="M380 206L60 300"/><path d="M320 206L-120 300"/><path d="M260 206L-300 300"/>
      <path d="M560 206L750 300"/><path d="M620 206L940 300"/><path d="M680 206L1120 300"/><path d="M740 206L1300 300"/>
    </g>
    <rect y="196" width="1000" height="20" fill="#ff2bd6" opacity="0.35" filter="url(#soft)"/>

    <!-- title (RGB-split glitch) -->
    <g text-anchor="middle">
      <text class="title glitch-a" x="500" y="150" fill="#ff2bd6" opacity="0.85">VIHAAN</text>
      <text class="title glitch-b" x="500" y="150" fill="#00f0ff" opacity="0.85">VIHAAN</text>
      <text class="title" x="500" y="150" fill="#ffffff" filter="url(#glow)">VIHAAN</text>
    </g>

    <!-- subtitle -->
    <g text-anchor="middle">
      <text class="mono" x="500" y="52" fill="#fcee0a">// 14 · breaking &amp; making things<tspan class="cursor" fill="#00f0ff"> _</tspan></text>
      <text class="tag" x="500" y="282" fill="#00f0ff" filter="url(#glow)">MACS  //  BEOS  //  RETRO COMPUTING</text>
    </g>

    <!-- scan beam + scanlines + vignette -->
    <rect class="scan" width="1000" height="40" fill="url(#beam)" opacity="0.5"/>
    <rect width="1000" height="300" fill="url(#scanlines)"/>
  </g>

  <!-- HUD frame -->
  <g fill="none" stroke-width="3" stroke-linecap="square">
    <path d="M10 44V10H44" stroke="#00f0ff"/><path d="M956 10H990V44" stroke="#ff2bd6"/>
    <path d="M10 256V290H44" stroke="#ff2bd6"/><path d="M956 290H990V256" stroke="#00f0ff"/>
  </g>
</svg>

<svg width="100%" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Vihaan Nathan — systems programmer</title>
  <desc id="heroDesc">
    Neon terminal banner. Vihaan Nathan, 14, systems programmer: writes operating
    systems, kernels and emulators from scratch in C, x86 assembly and C++.
  </desc>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070b"/>
      <stop offset="100%" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="hedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3a40"/>
      <stop offset="100%" stop-color="#0d1a1f"/>
    </linearGradient>
    <linearGradient id="hneon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="45%" stop-color="#19f7ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="hsweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19f7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#19f7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#19f7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#19f7ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="hscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>
  </defs>
  <clipPath id="hclip"><rect x="1" y="1" width="998" height="328" rx="12"/></clipPath>
  <g clip-path="url(#hclip)">
    <rect x="1" y="1" width="998" height="328" rx="12" fill="url(#hbg)"/>
    <rect x="1" y="1" width="998" height="328" rx="12" fill="url(#hgrid)"/>
    <rect x="1" y="1" width="998" height="328" rx="12" fill="url(#hscan)"/>
    <path d="M22 46 V22 H46" fill="none" stroke="#39ff14" stroke-opacity="0.5" stroke-width="2"/>    <path d="M978 46 V22 H954" fill="none" stroke="#39ff14" stroke-opacity="0.5" stroke-width="2"/>    <path d="M22 284 V308 H46" fill="none" stroke="#39ff14" stroke-opacity="0.5" stroke-width="2"/>    <path d="M978 284 V308 H954" fill="none" stroke="#39ff14" stroke-opacity="0.5" stroke-width="2"/>
    <text x="30" y="116" font-size="12" fill="#31505b" opacity="0.5">0xDEADBEEF</text>
    <text x="30" y="142" font-size="12" fill="#31505b" opacity="0.5">mov eax, 0x473</text>
    <text x="30" y="168" font-size="12" fill="#31505b" opacity="0.5">lgdt [gdt_desc]</text>
    <text x="30" y="194" font-size="12" fill="#31505b" opacity="0.5">int 0x80</text>
    <text x="30" y="220" font-size="12" fill="#31505b" opacity="0.5">cli / sti</text>
    <text x="30" y="246" font-size="12" fill="#31505b" opacity="0.5">call kmain</text>
    <text x="970" y="116" font-size="12" fill="#31505b" opacity="0.5" text-anchor="end">0b10100101</text>
    <text x="970" y="142" font-size="12" fill="#31505b" opacity="0.5" text-anchor="end">xchg esp, ebp</text>
    <text x="970" y="168" font-size="12" fill="#31505b" opacity="0.5" text-anchor="end">retf 0x08</text>
    <text x="970" y="194" font-size="12" fill="#31505b" opacity="0.5" text-anchor="end">0x7C00</text>
    <text x="970" y="220" font-size="12" fill="#31505b" opacity="0.5" text-anchor="end">iretd</text>
    <text x="970" y="246" font-size="12" fill="#31505b" opacity="0.5" text-anchor="end">page_fault</text>

    <!-- status line -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1.2">
      <circle cx="34" cy="30" r="5" fill="#ff2bd6" opacity="0.85"/>
      <circle cx="52" cy="30" r="5" fill="#ffb000" opacity="0.55"/>
      <circle cx="70" cy="30" r="5" fill="#39ff14" opacity="0.85"/>
      <text x="94" y="34" fill="#5d7f8b">root@github:~# ./whoami --verbose</text>
      <text x="970" y="34" text-anchor="end" fill="#31505b">id 0x473 · tty/1</text>
    </g>
    <line x1="1" y1="52" x2="999" y2="52" stroke="#0d1a1f" stroke-width="1"/>

    <!-- glitch ghosts + name -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="76" font-weight="700" letter-spacing="4" text-anchor="middle">
      <text x="495" y="158" fill="#ff2bd6" opacity="0.5">
        VIHAAN NATHAN
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-8 2;7 -2;0 0;0 0;0 0;0 0" keyTimes="0;0.6;0.63;0.66;0.69;0.82;0.92;1" dur="5.5s" repeatCount="indefinite"/>
      </text>
      <text x="505" y="158" fill="#19f7ff" opacity="0.42">
        VIHAAN NATHAN
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;9 -2;-6 2;0 0;0 0;0 0;0 0" keyTimes="0;0.6;0.63;0.66;0.69;0.82;0.92;1" dur="5.5s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="158" fill="url(#hneon)" filter="url(#hglow)">
        VIHAAN NATHAN
        <animate attributeName="opacity" values="0.88;1;0.88" dur="3.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- underline sweep -->
    <line x1="177.6" y1="178" x2="822.4" y2="178" stroke="url(#hneon)" stroke-width="2.5" stroke-dasharray="644.8" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="644.8;0;0" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- subtitle -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
      <text x="500" y="222" font-size="17.5" letter-spacing="0.6" fill="#19f7ff" filter="url(#hsoft)">systems programmer · 14 · builds oses, kernels &amp; emulators from scratch</text>
      <text x="500" y="256" font-size="13" letter-spacing="3.5" fill="#5d7f8b">C · x86-64 ASM · C++ · BASH · NO FRAMEWORKS</text>
    </g>

    <!-- footer strip -->
    <line x1="1" y1="284" x2="999" y2="284" stroke="#0d1a1f" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2">
      <text x="34" y="308" fill="#39ff14" opacity="0.85">[ ok ]</text>
      <text x="88" y="308" fill="#5d7f8b">13 public repos · everything compiled on bare metal and qemu</text>
      <text x="966" y="306" text-anchor="end" fill="#31505b">bash 5.2</text>
    </g>
    <rect x="970" y="292" width="11" height="16" fill="#39ff14" opacity="1">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.5;0.53;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="998" height="328" rx="12" fill="url(#hsweep)" opacity="0.09">
      <animate attributeName="y" values="-330;330" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="998" height="328" rx="12" fill="none" stroke="url(#hedge)" stroke-width="1.5"/>
  </g>
</svg>
